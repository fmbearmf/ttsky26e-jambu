name: test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Generate Verilog from Clash
        run: |
          nix build .#verilog
          mkdir -p src
          cp -f result/Project.topEntity/*.v src/

      - name: Run Cocotb Tests
        run: nix develop --command make -C test

      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: "test/results.xml"
        if: always()

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-artifacts
          path: |
            test/results.xml
            test/tb.vcd
            test/tb.fst
