name: docs
on:
  push:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Build Verilog from Clash
        run: |
          nix build .#verilog
          mkdir -p src
          cp -f result/Project.topEntity/*.v src/

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@ttsky26e
